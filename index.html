<!doctype html>
<html lang="en">
  <head>
    <!-- <script src="https://unpkg.com/react-scan/dist/auto.global.js"></script> -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>konlatt</title>
    <meta name="description" content="Visualize and analyze concept lattices online. Import data in multiple formats, explore relationships, and export lattice diagrams easily.">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" type="image/svg+xml" href="/images/logo_light.svg" sizes="180x180">
    <link rel="mask-icon" href="/images/logo_light.svg" color="#FFFFFF">
    <meta
      name="theme-color"
      content="#f8fafc"
      media="(prefers-color-scheme: light)" />
    <meta
      name="theme-color"
      content="#161921"
      media="(prefers-color-scheme: dark)" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem("theme") || "system";
          document.documentElement.setAttribute("data-theme", theme);

          if (theme === "dark" || theme === "light") {
            const color = theme === "dark" ? "#161921" : "#f8fafc";
            document.querySelectorAll('meta[name="theme-color"]').forEach((tag) => tag.remove());

            const meta = document.createElement("meta");
            meta.name = "theme-color";
            meta.setAttribute("content", color);
            document.head.appendChild(meta);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
  </head>
  <body class="bg-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
